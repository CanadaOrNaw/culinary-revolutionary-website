name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build the blog and sitemap
        run: python3 build-blog.py

      # Stage only the files that belong on a public business domain.
      # Uploading the repo root would also publish README.md, DESIGN.md,
      # ASSET-SOURCES.json and the menu generator — build notes and tooling,
      # not site content.
      - name: Stage the site
        run: |
          mkdir -p _site/public/assets
          cp index.html menus.html thank-you.html styles.css script.js _site/
          cp favicon.ico robots.txt sitemap.xml 7df5b1e0b37de01c7a1cfb04fc1aa0f1.txt _site/
          cp -r blog _site/blog
          cp .nojekyll _site/
          # CNAME is only present after the custom domain cutover.
          [ -f CNAME ] && cp CNAME _site/ || true
          # logo.png is the 1.5 MB original; every page references logo-256.png.
          rsync -a --exclude 'logo.png' --exclude 'source-home-full.png' \
            public/assets/ _site/public/assets/
          echo "--- staged artifact ---"
          find _site -type f | sort
          du -sh _site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
